[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bughouse-downloader"
version = "0.1.0"
description = "Download a chess.com player's bughouse games into a local SQLite database."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bughouse-dl = "bughouse_dl.cli:main"

[project.urls]
Repository = "https://github.com/Oh-My-Lands/bughouse-opening-toolkit"

[tool.setuptools.packages.find]
include = ["bughouse_dl*"]
