[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bughouse-explorer"
version = "0.1.0"
description = "Crawl Chess.com Bughouse games into a durable SQLite data platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.28",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bughouse-explorer = "bughouse_explorer.cli:main"
# Kept as a convenience alias for `bughouse-explorer serve` (used by start-server.sh / the web UI).
bughouse-explorer-serve = "bughouse_explorer.server:main"

[project.urls]
Repository = "https://github.com/Ellipsoul/bughouse-opening-explorer"
Original = "https://github.com/Oh-My-Lands/bughouse-opening-explorer"

[tool.setuptools.packages.find]
include = ["bughouse_explorer*"]

[tool.setuptools.package-data]
bughouse_explorer = ["crawler/sql/*.sql", "crawler/*.txt"]
